[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "propertyiq-getdata"
version = "0.1.0"
description = "ETL for NSW property data and Australian economic series, landed in the central Postgres."
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4",
  "curl-cffi>=0.16.0",
  "databricks-sdk>=0.128.0",
  "matplotlib",
  "numpy",
  "openpyxl",
  "pandas",
  "pyarrow>=25.0.1",
  "requests",
]

[project.optional-dependencies]
# `propertyiq-getdata db ...`: the central Postgres loader and the dbt project.
# Optional so a scrape-only install stays light: `uv sync --extra db`.
db = [
  "psycopg[binary]>=3.2",
  "dbt-core>=1.9",
  "dbt-postgres>=1.9",
]

# `python -m propertyiq_getdata ...` still works; this exposes the same CLI as a
# console script, so `uv run propertyiq-getdata ...` works too.
[project.scripts]
propertyiq-getdata = "propertyiq_getdata.cli:main"

# Dev-only tooling (PEP 735). Installed by default with `uv sync` / `uv run`;
# excluded from a lean runtime install via `uv sync --no-dev`.
[dependency-groups]
dev = [
  "pytest",
]

[tool.setuptools.packages.find]
include = ["propertyiq_getdata*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: hits a real upstream API; skipped by default, run with `pytest -m live`"]
addopts = "-m 'not live'"
